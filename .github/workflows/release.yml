name: Release
# Publishes to npm when a version tag is pushed: bump "version" in package.json and .claude-plugin/plugin.json,
# commit, then `git tag v0.1.1 && git push --tags`.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere. Set up once on npmjs.com under
# groundwork-mcp → Settings → Trusted Publisher → GitHub Actions (ganjilive / groundwork / release.yml).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # lets npm verify this workflow, and adds provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci
      - run: npm publish --access public
